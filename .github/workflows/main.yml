name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read
  packages: write

jobs:
  lint-format:
    name: 🔍 Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🎨 Ejecutar Prettier
        run: npm run format

      - name: 🔍 Ejecutar ESLint
        run: npm run lint

  security-analysis:
    name: 🛡️ Análisis de Seguridad
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📦 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📥 Instalar dependencias
        run: npm ci

      - name: 🔍 Escaneo de vulnerabilidades con npm audit
        run: npm audit --audit-level=high || true

      - name: 🛠️ Instalar Trivy
        run: |
          sudo apt-get install -y wget
          wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.59.1_Linux-64bit.deb
          sudo dpkg -i trivy_0.59.1_Linux-64bit.deb

      - name: 🔎 Análisis de seguridad con Trivy
        run: trivy fs --exit-code 1 --severity HIGH,CRITICAL .

  build-and-push:
    name: 🏗️ Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint-format, security-analysis]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name:  🔑 Login en GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: 🏗️ Construir imagen Docker
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')  # Convierte a minúsculas
          docker build -t $IMAGE_NAME .
  

      - name: 🚀 Subir imagen a GHCR
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')  # Convierte a minúsculas
          docker push $IMAGE_NAME
